<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR CODE Tekla — Visualizador 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#182b43}
    #app{height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:white;border-bottom:1px solid #e3e9f1}
    h1{font-size:18px;margin:0}small{color:#61758e} .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag{background:#eaf1fa;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700}
    main{flex:1;position:relative;min-height:0}#viewer{position:absolute;inset:0}#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
    #status{position:absolute;top:14px;left:14px;right:14px;max-width:520px;background:#fff;box-shadow:0 8px 35px #12263b21;border-radius:10px;padding:12px 16px;font-size:14px;z-index:2}
    #status.error{color:#9d2739;background:#fff0f0}#status.ok{display:none}
    #controls{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:2}
    button{background:white;border:1px solid #dce4ef;border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;color:#203552;cursor:pointer;box-shadow:0 3px 12px #00000010}button:hover{background:#eaf1fa}
    .hint{position:absolute;bottom:18px;left:15px;color:#546b86;background:#ffffffe8;border-radius:7px;padding:7px 9px;font-size:12px;pointer-events:none}
    @media(max-width:600px){header{padding:11px 13px}h1{font-size:15px}.hint{bottom:74px}.tag{padding:5px 8px;font-size:12px}}
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "web-ifc":"https://cdn.jsdelivr.net/npm/web-ifc@0.0.77/web-ifc-api.js"
    }}
  </script>
</head>
<body>
<div id="app">
<header><div><h1>QR CODE Tekla · Visualizador de conjuntos</h1><small>Modelo 3D de fabricação · Visualização no navegador</small></div><div class="meta"><span id="project" class="tag">Projeto: TESTE</span><span id="assembly" class="tag">Conjunto: C-101</span></div></header>
<main>
  <div id="viewer"></div>
  <div id="status" role="status">Inicializando visualizador 3D…</div>
  <div class="hint">Arraste para girar · Role para zoom · Botão direito para mover</div>
  <div id="controls"><button id="fit">Enquadrar</button><button id="reset">Vista isométrica</button><button id="wire">Arestas: desligadas</button></div>
</main>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {IfcAPI} from 'web-ifc';
const root = document.querySelector('#viewer');
const statusEl = document.querySelector('#status');
const parameters = new URLSearchParams(location.search);
const rawProject = parameters.get('projeto') || 'TESTE';
const rawAssembly = parameters.get('conjunto') || 'C-101';
const safePart = text => /^[a-zA-Z0-9_-]{1,70}$/.test(text) ? text : null;
const project = safePart(rawProject);
const assembly = safePart(rawAssembly);
document.querySelector('#project').textContent = `Projeto: ${project || 'inválido'}`;
document.querySelector('#assembly').textContent = `Conjunto: ${assembly || 'inválido'}`;
const setStatus=(message,error=false)=>{statusEl.textContent=message;statusEl.className=error?'error':'';};
const scene=new THREE.Scene();scene.background=new THREE.Color('#eff4f9');
const camera=new THREE.PerspectiveCamera(45,1,.001,1e8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7f94aa,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(4,9,7);scene.add(sun);
const sun2=new THREE.DirectionalLight(0xffffff,1);sun2.position.set(-6,3,-4);scene.add(sun2);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;
const modelRoot=new THREE.Group();scene.add(modelRoot);let edgesVisible=false;let currentBox;
function onResize(){const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height,false)}
window.addEventListener('resize',onResize);new ResizeObserver(onResize).observe(root);onResize();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
function frameModel(){if(!currentBox)return;const center=currentBox.getCenter(new THREE.Vector3()),size=currentBox.getSize(new THREE.Vector3());const diagonal=Math.max(size.length(),0.1);const fov=THREE.MathUtils.degToRad(camera.fov);const distance=(Math.max(size.x,size.y,size.z)/ (2*Math.tan(fov/2)))*2.0;
controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.2,.9,1.25).normalize().multiplyScalar(Math.max(distance,diagonal*1.5)));camera.near=Math.max(diagonal/10000,.0001);camera.far=Math.max(diagonal*1000,100);camera.updateProjectionMatrix();controls.update()}
document.querySelector('#fit').onclick=frameModel;document.querySelector('#reset').onclick=frameModel;
document.querySelector('#wire').onclick=()=>{edgesVisible=!edgesVisible;modelRoot.traverse(obj=>{if(obj.isLineSegments)obj.visible=edgesVisible});document.querySelector('#wire').textContent=edgesVisible?'Arestas: ligadas':'Arestas: desligadas'};
function ifcBuffer(api,modelID,placed){const raw=api.GetGeometry(modelID,placed.geometryExpressID);const vertex=api.GetVertexArray(raw.GetVertexData(),raw.GetVertexDataSize());const indices=api.GetIndexArray(raw.GetIndexData(),raw.GetIndexDataSize());const positions=new Float32Array(vertex.length/2),normals=new Float32Array(vertex.length/2);
for(let i=0,j=0;i<vertex.length;i+=6,j+=3){positions[j]=vertex[i];positions[j+1]=vertex[i+1];positions[j+2]=vertex[i+2];normals[j]=vertex[i+3];normals[j+1]=vertex[i+4];normals[j+2]=vertex[i+5]}
const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.BufferAttribute(positions,3));geom.setAttribute('normal',new THREE.BufferAttribute(normals,3));geom.setIndex(Array.from(indices));raw.delete();return geom}
async function load(){if(!project||!assembly){setStatus('Projeto ou conjunto contém caracteres inválidos.',true);return}
// Para o primeiro teste, C-101.ifc está na raiz. Os demais ficam em modelos/PROJETO/CONJUNTO.ifc.
const fallback=project==='TESTE'&&assembly==='C-101';const file=fallback?`./C-101.ifc`:`./modelos/${encodeURIComponent(project)}/${encodeURIComponent(assembly)}.ifc`;
try{setStatus(`Baixando ${file}…`);const response=await fetch(file);if(!response.ok)throw new Error(`Arquivo não encontrado (${response.status}): ${file}. Confira nome, maiúsculas e pasta no GitHub.`);
const data=new Uint8Array(await response.arrayBuffer());setStatus('Interpretando o IFC…');const api=new IfcAPI();api.SetWasmPath('https://cdn.jsdelivr.net/npm/web-ifc@0.0.77/');await api.Init();const modelID=api.OpenModel(data,{COORDINATE_TO_ORIGIN:true});let count=0;
try{api.StreamAllMeshes(modelID,flat=>{const placed=flat.geometries;for(let k=0;k<placed.size();k++){const item=placed.get(k);const geometry=ifcBuffer(api,modelID,item);const color=item.color;const material=new THREE.MeshStandardMaterial({color:new THREE.Color().setRGB(color.x,color.y,color.z,THREE.SRGBColorSpace),roughness:.8,metalness:.12,side:THREE.DoubleSide,transparent:color.w<.999,opacity:color.w,depthWrite:color.w>=.999});const mesh=new THREE.Mesh(geometry,material);mesh.matrixAutoUpdate=false;mesh.matrix.fromArray(item.flatTransformation);modelRoot.add(mesh);const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry,35),new THREE.LineBasicMaterial({color:0x243548,transparent:true,opacity:.55}));edges.matrixAutoUpdate=false;edges.matrix.copy(mesh.matrix);edges.visible=false;modelRoot.add(edges);count++;}})}finally{api.CloseModel(modelID)}
if(!count)throw new Error('O IFC foi lido, mas não contém geometria 3D que o visualizador conseguiu interpretar.');currentBox=new THREE.Box3().setFromObject(modelRoot);frameModel();statusEl.className='ok';document.title=`${assembly} | QR CODE Tekla`;
}catch(err){console.error(err);setStatus('Não foi possível abrir o conjunto: '+(err?.message||String(err)),true)}}
load();
</script>
</body>
</html>
